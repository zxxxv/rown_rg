# 레지스트리 배포 오버레이(2026-08-28) - 온박스 빌드 폐지의 나머지 반쪽.
#
# 배경: 8GB 운영 서버에서 서빙+torch급 빌드가 겹쳐 SSH까지 마비된 실사고.
# 빌드는 GitHub Actions(publish-app.yml)가 하고, 서버는 pull + up만 한다.
#
# 사용(배포 절차):
#   git push origin dev:main            # 승격 = 빌드 트리거 (~5-8분)
#   ssh rown 'cd ~/rown && git pull && \
#     docker compose -f docker-compose.prod.yml -f docker-compose.registry.yml pull app migrate && \
#     docker compose -f docker-compose.prod.yml -f docker-compose.registry.yml up -d'
#
# 선행 1회: 서버에서 ghcr 로그인(read:packages PAT) -
#   echo <PAT> | docker login ghcr.io -u <github사용자> --password-stdin
# SPA는 종전대로 별도 pnpm 빌드(이미지에 안 들어간다).

# 이미지 좌표 단일 선언 - migrate/app 두 서비스가 같은 이미지를 써야 하며, 두 줄로
# 살면 롤백(:main -> :<sha>) 때 한 줄만 고쳐 서로 다른 이미지로 뜨는 사고가 된다.
x-app-image: &app-image ghcr.io/zxxxv/rown-app:main

services:
  migrate:
    image: *app-image
  app:
    image: *app-image
    volumes:
      # 레지스트리 이미지는 모델 없이 굽는다(러너 체크아웃에 gitignore된 models/가
      # 없어 첫 빌드 실패, 2026-09-02). 호스트의 모델을 읽기 전용 마운트 -
      # 최초 1회 기존 컨테이너에서 추출: docker cp rown-app-1:/app/models ~/rown/models
      - ./models:/app/models:ro
