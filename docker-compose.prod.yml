# 프로덕션 배포용 compose — 단일 VM(AWS Lightsail 등)에 전체 스택을 올린다.
#
# 개발용 docker-compose.yml 과의 차이:
#   - app / postgres 포트를 호스트에 노출하지 않는다 (Caddy 뒤에만 존재).
#   - caddy 서비스가 80/443 에서 HTTPS 종료 + SPA 서빙 + API/WS 프록시.
#   - app 에 ENVIRONMENT=production 을 강제로 주입한다 (쿠키 Secure·IP 화이트리스트·CORS 활성).
#
# 사용:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 전제:
#   - .env 에 프로덕션 값이 채워져 있어야 한다 (JWT_SECRET_KEY 32자↑, POSTGRES_PASSWORD 등).
#   - models/ (약 1.1GB) 가 빌드 컨텍스트에 존재해야 한다 (gitignore 대상 — 별도 전송).
#   - web/dist 가 빌드되어 있어야 한다 (pnpm build).

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    env_file: .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 마이그레이션 1회 실행 후 종료. 앱은 이게 성공해야 뜬다.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # compose 의 environment 는 env_file 을 덮어쓴다 — 프로덕션 강제.
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # 호스트 포트 노출 없음 — caddy 만 app:8000 에 내부 네트워크로 접근한다.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
      - caddy_data:/data # 발급받은 인증서 영속화 (재시작 시 재발급 방지)
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
