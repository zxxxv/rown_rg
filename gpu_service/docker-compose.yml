# GPU 박스에서: docker compose -f gpu_service/docker-compose.yml up -d --build
# (빌드 컨텍스트가 저장소 루트라 반드시 루트에서 실행한다)
services:
  reranker:
    build:
      context: ..
      dockerfile: gpu_service/Dockerfile
    # 8000은 앱 개발 서버가 쓴다 - 겹치지 않게 8009.
    ports:
      - "127.0.0.1:8009:8009"
    env_file:
      - .env
    environment:
      # fp16 채택(2026-08-20 실측): fp32 대비 2.09배 빠르고 VRAM 절반.
      # 품질 확인 - Spearman 0.9996, 최대 절대오차 3.2e-5, top-24 차이는 동점급뿐.
      # VRAM이 절반이라 임베딩 모델을 같은 카드에 올릴 여지가 생긴다.
      GPU_MODEL_DIR: /models/bge-reranker-v2-m3-onnx-fp16
      GPU_DEVICE: cuda
    volumes:
      # 모델은 읽기 전용으로 넣는다 - 컨테이너가 가중치를 건드릴 이유가 없다.
      - ../models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # 모델 내보내기 (최초 1회) — 파이썬 설치 없이 도커만으로 GPU용 ONNX를 만든다.
  #   docker compose -f gpu_service/docker-compose.yml --profile setup run --rm exporter
  # fp16을 쓰려면 뒤에 인자를 덧붙인다:
  #   ... run --rm exporter --out /models/bge-reranker-v2-m3-onnx-fp16 --fp16 --verify
  exporter:
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: gpu_service/Dockerfile.export
    volumes:
      # 여기만 쓰기 권한이 필요하다 - 내보낸 모델이 호스트 models/ 로 나와야 하므로.
      - ../models:/models
    command: ["--out", "/models/bge-reranker-v2-m3-onnx"]
