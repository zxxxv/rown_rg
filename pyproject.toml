[project]
name = "rown-report-system"
version = "0.1.0"
description = "AI 보고서 자동생성 시스템"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # 웹 프레임워크
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    # DB
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # LLM·LangGraph
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    # 데이터 검증
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # 인증
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pyotp>=2.9",
    # 로깅
    "structlog>=24.4",
    # 임베딩
    "sentence-transformers>=3.3",
    "onnxruntime>=1.20",
    # 기타
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "python-hwpx>=2.9",
    "optimum[exporters,onnxruntime]>=2.0",
    "onnx>=1.17",
    "docling>=1.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "langchain-experimental>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    # SSO
    "python3-saml>=1.16.0",
    "pyjwt[crypto]>=2.13.0",
    "greenlet>=3.5.2",
]

[project.optional-dependencies]
# onnxruntime-gpu는 base onnxruntime(CPU)을 덮어쓰며 같은 namespace를 점유한다.
# 기본 sync는 CPU 표준을 유지하고, GPU 머신에서만 `uv sync --extra cuda` 로 전환한다.
cuda = [
    "onnxruntime-gpu>=1.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[tool.uv]
no-binary-package = ["lxml", "xmlsec"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/db/migrations/versions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/db/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: 단위 테스트 (빠름, mock 위주)",
    "integration: 통합 테스트 (DB·외부 서비스 사용)",
    "slow: 1초 이상 걸리는 테스트",
    "requires_model: ML 모델 로딩 필요 (BGE-M3·Reranker 등)",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
