# 앱 이미지 자동 발행 - 운영 서버 온박스 빌드 폐지의 반쪽(2026-08-28 결정).
# 배경: 8GB 서버에서 서빙+torch급 빌드가 겹쳐 SSH까지 마비된 실사고. 빌드는
# 여기(무료 러너)서 하고, 서버는 pull + up만 한다(docker-compose.registry.yml).
# 트리거는 main 전용(2026-08-28 결정) - dev는 수시 커밋이라 노이즈고,
# main = 운영에 나간 코드라는 감사 좌표를 겸한다. 급하면 workflow_dispatch.

name: Publish App Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      # 마이그레이션은 src/db/migrations(위 src/**에 포함)이고, alembic.ini는
      # Dockerfile이 COPY하므로 여기 있어야 재빌드가 걸린다("alembic/**"는
      # 존재하지 않는 경로라 영영 발화 안 하던 죽은 필터, 2026-09-03 수리).
      - "alembic.ini"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-app.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # models/(BGE-M3 로컬 모델, ~1.1GB)는 gitignore 대상이라 체크아웃에 없다 —
      # Dockerfile의 COPY models/가 러너에서 실패한 첫 빌드(2026-09-02)의 원인.
      # 레지스트리 이미지는 모델 없이 굽고, 서버가 볼륨으로 마운트한다
      # (docker-compose.registry.yml). 이미지가 1.1GB 가벼워져 pull도 빨라진다.
      - name: Empty models dir (host-volume mounted in registry mode)
        run: mkdir -p models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # 브랜치 태그(dev/main) = 배포 추적용, sha = 롤백 좌표.
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/rown-app:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.name }}/rown-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
