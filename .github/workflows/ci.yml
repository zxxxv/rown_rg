name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: ghcr.io/zxxxv/rown-postgres:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: rown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d rown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5432/rown
      POSTGRES_DB: rown
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ANTHROPIC_API_KEY: ""
      LOG_LEVEL: INFO
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install system libs for lxml/xmlsec source build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl pkg-config

      - name: Install Python and dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check (ruff format --check)
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term --cov-report=xml --cov-fail-under=60

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
