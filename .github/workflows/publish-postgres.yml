name: Publish Postgres Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.postgres"
      - ".github/workflows/publish-postgres.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/rown-postgres:latest
            ghcr.io/${{ steps.owner.outputs.name }}/rown-postgres:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
