services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 마이그레이션 1회 실행 후 종료. 앱은 이게 성공해야 뜬다(아래 depends_on).
  # 앱 이미지를 그대로 쓴다(alembic.ini + src/db/migrations 포함).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    # compose 내부에선 DB 호스트가 localhost가 아니라 서비스명 postgres다.
    # ${...}는 프로젝트 디렉터리의 .env에서 compose가 치환한다.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      # 컨테이너를 재생성하면 /app/data는 통째로 사라진다 - 업로드 자료가 날아간다
      # (2026-08-12 운영에서 실제로 PDF 6개 손실). prod와 같은 구성을 유지한다.
      - ./data:/app/data
      - ./exports:/app/exports
      - ./cache:/app/cache
